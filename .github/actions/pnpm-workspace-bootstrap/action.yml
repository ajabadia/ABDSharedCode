name: Bootstrap pnpm workspace (multi-repo)
description: >-
  Recrea el layout de hermanos del workspace pnpm de la suite ABDSynths (repo
  llamante + ABDSharedCode + ABDSharedAssets) e instala las dependencias. Los
  paquetes @abdsynths/* NO estan publicados en ningun registry: solo existen como
  miembros de este workspace, asi que sin este bootstrap `pnpm install` no puede
  resolver las dependencias declaradas como "workspace:*".

# ── Uso ──────────────────────────────────────────────────────────────────────
#
#   - name: Bootstrap pnpm workspace
#     uses: ajabadia/ABDSharedCode/.github/actions/pnpm-workspace-bootstrap@master
#     with:
#       project: ABDEep
#
# Sustituye a los 3 checkouts + el manifiesto + el setup de pnpm/node + el
# install. NO hagas un `actions/checkout` del repo llamante antes de esta accion:
# el layout de hermanos solo queda consistente si los tres checkouts los hace
# ella (y asi el `path:` del repo llamante es siempre el mismo).
#
# El checkout del repo llamante va SIN `repository:` a proposito, para heredar el
# comportamiento exacto de un checkout normal del workflow: asi un PR desde un
# fork resuelve igual (con `repository:` explicito se clonaria el repo base y se
# perderia el merge ref del PR).
#
# DEL MANIFIESTO, DEL INSTALL Y DE LA GUARDIA SE ENCARGA UN SCRIPT, NO ESTE
# FICHERO. Se llama a `ABDSharedCode/tools/bootstrap-workspace.mjs`, que es el
# mismo que se ejecuta en local, y esa es toda la gracia: el unico que sabe como
# es el workspace esta escrito una vez. Anadir un paquete pnpm a ABDSharedCode, o
# cambiar la tabla de aprobaciones de scripts, ya no obliga a tocar esta accion ni
# ningun workflow de la suite.
#
# Tras esta accion el workspace es:
#
#   $GITHUB_WORKSPACE/
#     pnpm-workspace.yaml          <- lo escribe el script
#     <project>/                   <- repo llamante  (node_modules/@abdsynths/* -> ../)
#     ABDSharedCode/               <- @abdsynths/midi-keyb (+ cualquier miembro futuro)
#     ABDSharedAssets/             <- @abdsynths/shared

inputs:
  project:
    description: >-
      Nombre del directorio del repo llamante dentro del workspace (p.ej. ABDEep
      o ABDMS2000). Es a la vez su ruta de checkout y su miembro del workspace.
    required: true
  node-version:
    description: Version de Node.js.
    required: false
    default: '20'
  pnpm-version:
    description: >-
      Version de pnpm. Medido: la maquina de desarrollo usa la 12.8.1 y este
      input era 10, asi que una prueba podia pasar en local y fallar en CI (o al
      reves) sin que nadie tocase nada. Los dos repos que fijan `packageManager`
      (la raiz de la suite y ABDSharedCode) ya declaran 12.8.1.
    required: false
    default: '12.8.1'
  shared-code-ref:
    description: >-
      Ref (rama/tag/SHA) de ABDSharedCode. Vacio = la rama por defecto del repo.
    required: false
    default: ''
  shared-assets-ref:
    description: >-
      Ref (rama/tag/SHA) de ABDSharedAssets. Vacio = la rama por defecto del repo.
    required: false
    default: ''
  skip-puppeteer-download:
    description: >-
      Omite la descarga del Chromium de puppeteer durante el install. Ningun job
      de la suite usa puppeteer (los e2e usan Playwright) y MidiKeyboard lo trae
      como devDependency: son ~150 MB por job que nadie consume.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # ── Guarda de colision: ANTES de clonar ────────────────────────────────────
    # Los dos ultimos pasos usan `path:` fijo (`ABDSharedCode` y `ABDSharedAssets`)
    # y el primero usa `path: <project>`. Si `project` fuera uno de esos dos, dos
    # checkouts cairian en el mismo directorio con repos distintos, y por lo medido
    # (ver README.md, "Lo que decide es el REMOTO, no el path: repetido")
    # `actions/checkout` borra el contenido del primero: el repo llamante
    # desapareceria del workspace y el fallo apareceria mas tarde, en el
    # `pnpm install`, con un motivo que no nombra al checkout que lo rompio.
    #
    # Esta guarda es la que se dispara primero. La de
    # `tools/bootstrap-workspace.mjs` sigue ahi y sigue siendo necesaria (ella ve
    # el layout real, que es lo que de verdad manda), pero para este error concreto
    # esta dice el porque en el paso donde se puede evitar la clonacion entera.
    #
    # El input va por env y se referencia como "$ABD_PROJECT", nunca interpolado con
    # ${{ }}: un input interpolado se convierte en codigo shell (mismo motivo que el
    # paso de bootstrap de mas abajo).
    - name: Guard against checkout path collisions
      shell: bash
      env:
        ABD_PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail

        # La comparacion es SIN mayusculas a proposito. Los jobs que usan esta
        # accion corren en `windows-latest`, y alli el sistema de ficheros no
        # distingue `abdsharedcode/` de `ABDSharedCode/`: son el mismo
        # directorio, luego la colision del caso A ocurre igual y con el mismo
        # borrado. En Linux el path si distingue, pero ahi el repo con esa
        # capitalizacion tampoco existe y el fallo seria de otro tipo.
        caso="${ABD_PROJECT,,}"

        case "$caso" in
          abdsharedcode|abdsharedassets)
            echo "::error::project: '$ABD_PROJECT' no puede ser el repo llamante: colisiona con el checkout fijo de ese mismo repo."
            echo "::error::La accion hace tres checkouts en <project>/, ABDSharedCode/ y ABDSharedAssets/. Con project: '$ABD_PROJECT' los dos primeros caen en el mismo path y con repos distintos."
            echo "::error::Medido sobre actions/checkout: si el path ya tiene un remoto distinto, borra su contenido ('Deleting the contents of ...'). El repo llamante desapareceria del workspace."
            echo "::error::Sin esta guarda el fallo saldria tres pasos mas tarde, en el pnpm install, con un motivo que no nombra al checkout que lo rompio. Usa otro project (ABDEep, ABDMS2000, ABDNeural, ABDCZ101)."
            exit 1
            ;;
        esac

    # ── Layout del monorepo ──────────────────────────────────────────────────
    # Los tres repos van como HERMANOS dentro del workspace. Es la misma
    # disposicion que tiene el checkout local de la suite, donde
    # node_modules/@abdsynths/* son symlinks a ../.
    - name: Checkout calling repository
      uses: actions/checkout@v5
      with:
        path: ${{ inputs.project }}

    - name: Checkout ABDSharedCode (@abdsynths/midi-keyb)
      uses: actions/checkout@v5
      with:
        repository: ajabadia/ABDSharedCode
        path: ABDSharedCode
        ref: ${{ inputs.shared-code-ref }}

    - name: Checkout ABDSharedAssets (@abdsynths/shared)
      uses: actions/checkout@v5
      with:
        repository: ajabadia/ABDSharedAssets
        path: ABDSharedAssets
        ref: ${{ inputs.shared-assets-ref }}

    # Los tres checkouts de arriba tienen que seguir siendo `actions/checkout`:
    # el del repo llamante sin `repository:` para heredar el comportamiento de un
    # checkout normal (asi un PR desde un fork resuelve igual), y los otros dos
    # porque son repos que este workflow no puede clonar por su cuenta.

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    # Sin cache: no hay pnpm-lock.yaml versionado en ninguno de los repos de la
    # suite (el del workspace vive en el repo raiz, que no se clona), y
    # setup-node falla en duro si declara cache y no encuentra el lockfile.
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    # ESTE PASO NO TIENE LOGICA DE WORKSPACE, Y ESO ES LO IMPORTANTE.
    #
    # Antes de que existiera `tools/bootstrap-workspace.mjs` en modo CI, esta accion
    # tenia aqui tres `run:` de bash que generaban el manifiesto, instalaban y
    # verificaban el layout. La logica estaba duplicada: una copia en bash que solo
    # se ejecutaba en CI, y el script que se ejecuta en local. Dos copias del mismo
    # layout se separan en silencio, y la que se separa es la que nadie ejecuta.
    #
    # Ahora el unico que sabe como es el workspace es el script, que ademas lo
    # hace igual en local que en CI: `--workspace-root` le dice donde esta el
    # workspace y `--project` quien es el repo llamante, que es lo unico que CI
    # sabe y que el script de local no puede saber.
    #
    # Lo que queda de bash es una linea, y no se puede quitar: los inputs van por
    # env y se referencian como "$ABD_PROJECT", nunca interpolados con ${{ }},
    # porque un input interpolado se convierte en codigo shell.
    - name: Bootstrap workspace (tools/bootstrap-workspace.mjs)
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ABD_PROJECT: ${{ inputs.project }}
        ABD_SKIP_PUPPETEER: ${{ inputs.skip-puppeteer-download }}
      run: |
        set -euo pipefail

        # El script NO hereda de este bash step el `set -e` de arriba: es un proceso
        # nuevo, y su codigo de salida es el suyo (0 listo, 1 falta algo, 2 mal
        # escrito). Un `node ... || exit 1` se tragaria esa distincion y dejaria un
        # "mal escrito" como si fuera "falta algo".
        exec node ABDSharedCode/tools/bootstrap-workspace.mjs \
          --workspace-root "$GITHUB_WORKSPACE" \
          --project "$ABD_PROJECT"
