name: Shared code CI

# El PRIMER workflow de este repo, y con una limitacion que conviene saber antes
# de fiarse de el: ABDSharedCode no tiene codigo propio que ejecutar. Es codigo
# que vive aqui y se consume desde fuera (ABDEep, ABDMS2000, ABDNeural,
# ABDCZ101), y lo unico que se puede comprobar aqui sin esos repos es si el
# codigo esta sano por si mismo: que sus pruebas corran, que sus herramientas
# salgan en verde y que el package que publica resuelva sus dependencias.
#
# LO QUE ES PUERTA. Los siete trabajos bloquean, y los siete salen en verde.
#
# El septimo (`synthcore`) es el primero que EJECUTA C++ aqui: compila las
# tres baterias sin JUCE ni GUI del proyecto —ABDShared_SynthCore_Tests,
# ABDShared_DspCore_Tests y ABDShared_DspEffects_Tests— y las corre en ubuntu
# (gcc/clang: el terreno donde nunca se habian ejecutado) y en windows (MSVC:
# el terreno del que vienen). El exit code de cada binario es el veredicto:
# mas de ocho mil comprobaciones en total, y una sola en rojo deja el pipeline
# en rojo. Los tres, y no solo SynthCore, porque un error que solo revienta
# con gcc (std::size sin <iterator>, rutas de include que MSVC resuelve y gcc
# no) o que solo revienta al EJECUTARSE (un frame de main de 2,4 MB que
# desborda la pila de Windows) no sale a la luz hasta que la puerta compila y
# corre ese modulo en ambas plataformas.
#
# El audit merece una explicacion, porque sin ella su veredicto se lee mal. Compara
# este repo contra una foto de la suite fijada por SHA, y en esa foto hay 55 fuentes
# sin consumidor que aqui no lo estan: el trabajo que las consume esta escrito pero
# SIN COMMITEAR en los repos hermanos. En vez de dejar el job en warning, esa foto
# esta escrita en `tools/audit-baseline.json` y el script la usa de TRINQUETE: una
# fuente que ya esta en la linea base no es un fallo nuevo, una que no esta sale 1,
# y una entrada de la linea base que ya NO hace falta sale 1 tambien, porque si no
# la linea base seria un escudo que solo crece y nadie podaria nunca.
#
# Y el cuarto trabajo (`foto`) es el que vigila el suelo de todo eso. La linea
# base dice 55 nombres, pero no dice CONTRA QUE SHA se midieron: subir el SHA del
# checkout de un hermano no cambia los nombres, asi que el audit se queda en
# verde y su veredicto ya no habla de lo que CI va a medir. Medido, no supuesto:
# un commit nuevo en ABDNeural que no toca consumidores deja el audit en 0. Este
# trabajo compara el SHA con el que se midio la linea base contra el SHA del
# checkout de aqui, y falla si no son el mismo.
on:
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'MidiKeyboard/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'CMakeLists.txt'
      - '.github/actions/**'
      - '.github/workflows/shared-code-ci.yml'
      - '.clang-format'
      - '.githooks/**'
      - '**/*.{h,cpp}'
      # Los .inc de SynthCore/tests son la mitad de la bateria que este
      # workflow acaba de empezar a ejecutar: sin esta linea, un push que solo
      # toque un test no encendiera la puerta que lo prueba.
      - '**/*.inc'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Tools (node:test, sin dependencias)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABDSharedCode
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # El mismo que usa la accion `pnpm-workspace-bootstrap` en el resto de
          # la suite, para que una prueba no pase en local con Node 24 y falle
          # aqui, o al reves.
          node-version: '20'

      # SIN DEPENDENCIAS, a proposito. Este repo no tiene `package.json` de
      # tooling, ni vitest, ni runner; el guard de `.gitattributes` esta hecho
      # con `node:test` y `assert`, que vienen en el runtime. Meter un runner
      # para veinte pruebas seria meter una cadena de dependencias en un repo que
      # no la tiene, y el guard que vigila los binarios terminaria dependiendo de
      # un `pnpm install` que nadie recuerda hacer.
      #
      # EL FICHERO SE NOMBRA UNO A UNO, Y NO ES COSA ESTETICA. `node --test
      # tools/` solo funciona en Node <=20: hasta la 20, `node --test` recibia un
      # DIRECTORIO y lo buscaba recursivamente; desde la 21 recibe PATRONES GLOB, y
      # el glob `tools` casa con el propio directorio, que Node carga como modulo
      # y responde MODULE_NOT_FOUND. El glob explicito tampoco vale como arreglo,
      # porque en la 20 el argumento se toma literal y no encuentra nada.
      #
      # Este job usa Node 20 y la maquina de desarrollo ya va por la 24, asi que
      # cualquier forma con directorio o glob pasa en un lado y falla en el otro.
      # Un nombre de fichero explicito es la unica que no depende de la version.
      #
      # El precio de eso es que los ficheros hay que nombrarlos, y por eso el
      # ultimo bloque de la propia suite comprueba que no haya mas `*.test.mjs` en
      # `tools/` que los que nombra la cabecera del test. Ese guard corre aqui, en
      # local y en cualquier clon; por eso este job no necesita un paso extra que
      # compruebe la orden, y por eso antes no habia uno que la comprobara bien.
      - name: Guard de .gitattributes
        run: node --test tools/guard_atributos.test.mjs

      # LAS PRUEBAS DEL GUARD DE NODE 20, Y POR QUE VAN AQUI Y NO EN SU JOB.
      # Este guard tiene su propio job porque necesita los nueve repos; sus
      # pruebas no necesitan ninguno, son un workflow sintetico de tres lineas.
      # Separarlas evita pagar nueve checkouts para probar una tabla.
      #
      # La mitad de estas pruebas tienen que SALIR CON 1: si el guard se rompiera
      # y saliera siempre con 0, aqui se caeria, y con ellas el rojo. Un guard
      # solo visto pasar no se sabe si pasa.
      - name: Pruebas del guard de Node 20
        run: node --test tools/guard_node20.test.mjs

      # EL README DE LA ACCION SE GENERA DESDE EL JSON, Y AQUI SE COMPRUEBA.
      # Antes el README y `tools/checkout-medido.json` contaban la misma tabla
      # dos veces y un test comparaba las dos copias. Con generar, la tabla se
      # escribe una vez: si alguien edita el bloque del README a mano, este paso
      # sale con 1 y dice que loCorrija con el generador. Sin este paso, la
      # edicion a mano se colaba hasta el proximo cambio de la tabla.
      - name: El README de la accion es lo que se genera desde el JSON
        run: python3 tools/medir_checkout.py readme --check

  # ESTE TRABAJO NO COMPILA NADA. Lee .clang-format y comprueba que todos los
  # .h/.cpp del repo obedecen el estilo. No es un trabajo de verificacion de
  # dependencias ni de compilacion: es una puerta de calidad de codigo, como los
  # otros guards, pero sobre el ESTILO y no sobre el COMPORTAMIENTO.
  #
  # POR QUE AQUI Y NO EN EL HOOK. El hook pre-commit formatea los archivos antes
  # de commitear, pero con --no-verify se puede saltar. El hook tambien depende de
  # que el developer tenga clang-format instalado, y en local eso puede no pasar.
  # Aqui es obligatorio: si un archivo no esta formateado, el job falla, y el
  # mensaje de error dice exactamente que archivos y lineas son las que no cuadran.
  #
  # POR QUE SEIS TRABAJOS Y NO CINCO. El comentario de encabezado dice cinco;
  # este lo pone a seis. No es un trabajo de compilacion ni de test: es la unica
  # forma de que el estilo no se escape en los pushes que bypass el hook.
  clang-format:
    name: Clang-format (estilo de codigo C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABDSharedCode
        uses: actions/checkout@v7

      - name: Install clang-format 18+
        run: pip install clang-format==18.*

      # Este paso ejecuta EL HOOK en modo VERIFY_ONLY, no clang-format directamente.
      # VERIFY_ONLY=1 hace que el hook compruebe TODOS los archivos .h/.cpp con
      # --dry-run --Werror, SIN modificar nada en disco. Asi no solo verificamos
      # el estilo, sino que verificamos que EL HOOK misma funciona.
      #
      # El hook usa `git ls-files` (no `find`) para listar los archivos, por lo
      # que funciona identico en local y en CI. Si el hook falla aqui, el hook
      # esta roto, no solo el estilo.
      - name: Run pre-commit hook in verify-only mode
        run: |
          set -o pipefail
          VERIFY_ONLY=1 bash .githooks/pre-commit

      # CONFIRMA QUE EL HOOK DETECTA ARCHIVOS MAL FORMATEADOS, no solo que pasa
      # cuando todo esta bien. Crea un fichero temporal con estilo roto, ejecuta
      # el hook, verifica que falla (exit != 0), y limpia. Si este paso no falla
      # al crear el fichero malo, el hook ignora violaciones por completo.
      #
      # El fichero se escribe en /tmp y se enlaza con un path .cpp para que clang-
      # format lo procese. No se toca el arbol de trabajo real.
      - name: Hook catches unformatted code (negative test)
        shell: bash
        run: |
          set -o pipefail
          CF="$(command -v clang-format)"
          echo "Testing with: $CF"
          # Create a deliberately misformatted file: no spaces after keywords,
          # wrong brace placement, tabs instead of spaces.
          mkdir -p /tmp/hook-test
          printf 'int main(){return 0;}\n' > /tmp/hook-test/bad.cpp
          # Temporarily make git track it so the hook can see it via git ls-files
          cp /tmp/hook-test/bad.cpp .hook_test_bad.cpp
          git add .hook_test_bad.cpp
          # The hook in verify-only mode MUST fail on this file.
          set +e
          VERIFY_ONLY=1 bash .githooks/pre-commit > /tmp/hook-test/output.log 2>&1
          EXIT_CODE=$?
          set -e
          git reset -q .hook_test_bad.cpp
          rm -f .hook_test_bad.cpp /tmp/hook-test/bad.cpp
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::el hook no detecto el archivo mal formateado. VERIFY_ONLY puede estar roto."
            cat /tmp/hook-test/output.log
            exit 1
          fi
          echo "Hook correctly caught unformatted code (exit $EXIT_CODE)."
          echo "--- hook output ---"
          cat /tmp/hook-test/output.log | head -20

  midikeyboard:
    name: MidiKeyboard (vitest)
    runs-on: ubuntu-latest
    steps:
      # ESTE REPO ES EL QUE LLAMA, Y TAMBIEN EL QUE ESTA DENTRO. Medido: al
      # pasarle `project: ABDSharedCode` a la accion, los dos checkouts caen
      # en la MISMA carpeta y el resultado es
      #
      #   $GITHUB_WORKSPACE/
      #     pnpm-workspace.yaml
      #     ABDSharedCode/          <- el repo llamante
      #       ABDSharedCode/        <- y otra vez ABDSharedCode, dentro
      #     ABDSharedAssets/
      #
      # con el manifiesto de `packages:` diciendo ABDSharedAssets,
      # ABDSharedCode/MidiKeyboard y ABDSharedCode. La accion esta disenada para
      # un llamante EXTERNO (ABDEep, ABDMS2000), donde las dos carpetas no
      # chocan. Aqui chocan.
      #
      # Por eso este trabajo no usa la accion: hace sus propios checkouts (este
      # repo y ABDSharedAssets) y llama al MISMO script, que es el unico que
      # sabe como es el workspace. Lo que no se reimplementa es el layout, solo
      # el `path:` de cada clon, que es lo unico que cambia entre un llamante y
      # otro. La accion se queda como esta para los tres repos de la suite que
      # si la necesitan.
      - name: Checkout ABDSharedCode (este repo)
        uses: actions/checkout@v7

      - name: Checkout ABDSharedAssets (@abdsynths/shared)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDSharedAssets
          path: ABDSharedAssets

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.8.1'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Bootstrap workspace (tools/bootstrap-workspace.mjs)
        shell: bash
        env:
          ABD_SKIP_PUPPETEER: 'true'
        run: exec node tools/bootstrap-workspace.mjs

      # `pnpm test` es el script del paquete. Los 340 tests incluyen
      # `host-strip-height.test.js`, que es el contrato de franja de los cuatro
      # synths que montan el teclado: aqui se ejecutan 331 y 9 se OMITEN con un
      # motivo impreso, porque este checkout no trae ABDMS2000 ni ABDEep ni los
      # demas. Que se omitan no es un fallo, pero si desapareciera el motivo
      # impreso seria un verde que parece una comprobacion.
      #
      # `set -o pipefail`, Y POR QUE ESTA AQUI. Medido en el primer push: este
      # paso salio VERDE con `pnpm test` fallando. `pnpm test | tee log` devuelve
      # el codigo de `tee`, que es 0 siempre, y el shell por defecto de Actions
      # (`bash -e`, sin `pipefail`) no lo arregla: asi que un install roto, un
      # test rojo o un error de pnpm salen como un job en verde. El log de
      # ese push decia `ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND` debajo de un tick.
      # Sin esta linea, el log es lo unico que se opone al verde falso, y el log
      # no se lee solo.
      - name: Tests de MidiKeyboard
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/midikeyboard.log"

      # La salida del paso anterior, no una segunda pasada: la suite son 340
      # pruebas con jsdom y tardarse dos veces en lo mismo no compra nada.
      - name: El motivo del OMITIDO se imprime (un salto callado seria un verde falso)
        run: |
          if ! grep -q "OMITIDO: este fichero no se puede ejecutar aqui" "$RUNNER_TEMP/midikeyboard.log"; then
            echo "::error::el fichero omitido no dice POR QUE. Un skip sin motivo se lee como una comprobacion que paso."
            exit 1
          fi
          echo "el motivo del OMITIDO aparece en la salida: el salto no es silencioso"

  # ESTE TRABAJO NO MIDE NADA DE ESTE REPO. Compara un dato con otro dato: el
  # SHA contra el que se midio `tools/audit-baseline.json`, y el SHA que los
  # checkout de ARRIBA (los del job `audit`) van a clonar. Los dos estan
  # escritos, y no hace falta ningun repo al lado ni ningun Python de la suite.
  #
  # Va como trabajo aparte y no como paso del `audit` por una razon que se ha
  # medido: si fuera un paso, su fallo y el del audit caerian en el MISMO log y
  # no se podrian distinguir. Aqui se sabe que lo que se ha movido es el suelo.
  #
  # El caso que cierra, medido en un clon con los cinco hermanos en su SHA: un
  # commit nuevo en ABDNeural que no toca ningun consumidor deja el audit en 0,
  # porque el conjunto de huerfanas no cambia (siguen siendo 55, los consumidores
  # siguen sin commitear) y el trinquete solo compara NOMBRES. La linea base
  # sigue diciendo "estas 55" y no hay forma de saber que se ha movido el suelo.
  # Con este trabajo, ese commit obliga a regenerar la linea base antes de que
  # el audit de la proxima vez signifique algo.
  #
  # Y el caso al reves, que es el peor: si la linea base se regenera en LOCAL,
  # donde los hermanos tienen el trabajo sin commitear en el disco, lo que se
  # commitea no son las huerfanas de CI. El audit daria 1 con 55 huerfanas
  # nuevas y el motivo no nombra la causa. Aqui el rojo lo dice antes.
  foto:
    name: Foto de la linea base (los SHA no se mueven solos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABDSharedCode
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # El script lee los SHA del PROPIO workflow, no de una lista suya. Por eso
      # no hay un segundo sitio que poner al dia y por eso este trabajo no
      # necesita que nadie le avise: si el workflow cambia un SHA, cambia lo que
      # este script lee. Una lista de repos en el propio script seria una copia
      # mas, y las copias se separan en silencio.
      #
      # Sin `continue-on-error` y sin `warning`, como los otros. Un guard que se
      # puede dejar en warning es un guard que no guarda.
      - name: La foto de la linea base es la que el workflow va a medir
        run: python tools/verificar_foto.py --check

      # UN SHA QUE YA NO EXISTE, DICHO COMO TAL. `actions/checkout` falla si el
      # SHA no esta en el remoto (un force-push que lo borre, o un repo
      # renombrado) y su mensaje habla de refs, no de la linea base: quien lo lee
      # ve un fallo de checkout en un job que se llama `foto` y no entiende que
      # lo que se movio fue el suelo del audit.
      #
      # El listado sale de `--listar` de este mismo guard, no de un parser
      # escrito en el `run:`. Dos vistas de "los SHA del workflow" escritas en
      # dos sitios se separan en silencio, y la que se separa es la que nadie
      # ejecuta.
      #
      # Va con `continue-on-error` a proposito, y es el UNICO paso del repo que
      # lo lleva: si el remoto no responde, lo que no se ha podido comprobar es
      # la EXISTENCIA del SHA, y de eso el checkout diria mucho mejor que uno
      # inventado aqui. Ademas es un aviso, no una puerta: un SHA borrado NO es
      # un problema de este repo, y el `audit` se encarga de caerse por su cuenta.
      - name: Los SHA que clona el job de audit existen todavia
        continue-on-error: true
        run: |
          python tools/verificar_foto.py --listar | while read -r repo sha; do
            if git ls-remote "https://github.com/ajabadia/$repo" | grep -q "^$sha"; then
              echo "$repo $sha sigue en el remoto"
            else
              echo "::warning::El SHA $sha de ajabadia/$repo no aparece en el remoto. O lo han borrado con un force-push, o el repo se ha movido. Si es un force-push, el job de audit no podra clonar ese repo y caera con un mensaje de checkout que no nombra la linea base."
            fi
          done


  # EL QUINTO TRABAJO, Y EL MAS BARATO DE TODOS. No clona repos, no compila nada y
  # no tarda: lee ficheros YAML que ya estan en disco y sale con 0 o con 1.
  #
  # QUE CIERRA. El primer push de este repo salio con un job en VERDE que no habia
  # pasado: `pnpm test 2>&1 | tee log` devuelve el codigo de `tee`, que es 0
  # siempre, y el shell por defecto de Actions (`sh`, que es `-e {0}`) no lo
  # arregla. El log decia ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND debajo de un tick, y
  # lo que lo delato fue que otro job, el `foto`, tambien salio raro. Si nadie
  # hubiera mirado el log, el verde falso se queda.
  #
  # Lo que hace este trabajo es convertir ese hallazgo de casualidad en puerta. Es
  # la unica forma de que no vuelva: no es que el guard explique el fallo, es que
  # el fallo no se puede commitear.
  #
  # POR QUE ESTE TRABAJO Y NO UNO MAS. Los otros cuatro miden algo de este repo.
  # Este mide LOS OTROS repos de la suite: los hermanos se clonan aqui abajo (job
  # `audit`) y el guard recorre sus `.github/workflows/`. Sin el, un `| tee` sin
  # pipefail en ABDEep pasaria tan desapercibido como paso en el de aqui.
  #
  # Y POR QUE NO ES UN PASO DEL `audit`. El `audit` mide las fuentes huerfanas; este
  # mide si los jobs de la suite pueden mentir sobre su propio resultado. Si
  # compartieran log, un rojo de este se leeria como un rojo del audit, que es justo
  # el diagnostico equivocado. Aqui se sabe que se ha movido el shell, no el suelo.
  pipes:
    name: Pipes (ningun trabajo de la suite se pone verde sin pasar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABDSharedCode (este repo)
        uses: actions/checkout@v7

      # Los hermanos, y SOLO para leer sus workflows. Estos mismos SHA son los del
      # job `audit` y los de la foto de la linea base: la lista no se escribe aqui,
      # sale de `verificar_foto.py --listar`, que la lee del propio workflow. Si el
      # workflow anade un repo, este trabajo lo sigue sin que nadie actualice nada.
      #
      # Sin `ref:`, a proposito: aqui no interesa el estado commiteado de los
      # hermanos (eso es la foto, y la mide el job `foto`), sino el `HEAD` de su
      # rama, que es donde alguien esta a punto de meter el `| tee`. Un guard de los
      # repos ya arreglados no ve los que se rompen manana.
      - name: Checkout ABDEep (HEAD)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDEep
          path: ABDEep

      - name: Checkout ABDMS2000 (HEAD)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDMS2000
          path: ABDMS2000

      - name: Checkout ABDNeural (HEAD)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDNeural
          path: ABDNeural

      - name: Checkout ABDCZ101 (HEAD)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDCZ101
          path: ABDCZ101

      - name: Checkout ABDSharedAssets (HEAD)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDSharedAssets
          path: ABDSharedAssets

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Sin dependencias, sin PyYAML y sin `pnpm install`. Es un lector de YAML con
      # regex, no un parser: lo que busca es un `run:` con un `tee` y el shell que
      # lo ejecuta, y eso se lee con la misma logica con la que `verificar_foto.py`
      # saca los SHA del workflow. Un guard que necesita `pnpm install` para leer un
      # YAML acaba sin ejecutarse el dia que el install falla.
      #
      # `--raiz` es el workspace, que tiene el layout que el script espera: un
      # directorio por repo. En local se pasa el arbol de la suite y es el mismo
      # script con la misma forma, asi que lo que sale en verde aqui es lo que sale
      # en verde ahi.
      - name: Ningun `| tee` puede perder el codigo de salida
        run: python tools/guard_pipefail.py --check --raiz "$GITHUB_WORKSPACE"

      # EL CONTRASTE DEL RECUENTO, Y POR QUE NO ES RUIDO. Un guard en verde que no
      # ha medido nada es el peor resultado posible, porque parece una
      # comprobacion. Por eso el paso anterior imprime el numero de repos y de
      # pasos que ha mirado, y este lo comprueba: si el guard se queda sin
      # hermanos, o sin YAML, o sin un solo `run:`, sale 2 (que no se ha medido
      # nada), y este paso avisa de que la puerta no estaba puesta.
      # `shell: bash` y `set -o pipefail`, y no por costumbre: este paso hace un
      # `| tee` y este mismo trabajo es el que lo vigila. Sin las dos cosas, el
      # guard de abajo marcaria ESTE paso. Un guard que no puede pasar por el fichero
      # que vigila no vigila nada.
      - name: El guard ha mirado de verdad (un 0 sin medir no es un verde)
        shell: bash
        run: |
          set -o pipefail
          python tools/guard_pipefail.py --listar --raiz "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/pipes.txt"
          pasos=$(grep -o 'pasos con codigo ejecutable: [0-9]*' "$RUNNER_TEMP/pipes.txt" | grep -o '[0-9]*')
          repos=$(grep -o 'repos con workflows: [0-9]*' "$RUNNER_TEMP/pipes.txt" | grep -o '[0-9]*')
          echo "repos con workflows: $repos, pasos mirados: $pasos"
          if [ "${repos:-0}" -lt 6 ]; then
            echo "::error::el guard ha mirado solo ${repos:-0} repos. Se esperaban 6 (este + los 5 hermanos). Si un checkout no se completo, el paso anterior no estaba midiendo la suite entera."
            exit 1
          fi
          if [ "${pasos:-0}" -lt 50 ]; then
            echo "::error::el guard ha mirado solo ${pasos:-0} pasos con codigo. Con 6 repos clonados eso no es la suite: el layout del workspace no es el que el guard espera."
            exit 1
          fi
          echo "el guard ha mirado $repos repos y $pasos pasos: el 0 de antes era un 0 medido"

  audit:
    name: Audit de fuentes (trinquete)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABDSharedCode
        uses: actions/checkout@v7
        with:
          path: ABDSharedCode

      # Los hermanos, por SHA INMUTABLE, que es lo que espera el auditor: calcula
      # la suite como el directorio PADRE de este repo y luego pregunta a cada
      # proyecto que CMakeLists tiene. Una rama se moveria sola y el veredicto
      # pasaria de hoy a manana sin que nadie tocase nada; fijado, el fallo es
      # siempre el mismo y siempre aqui.
      #
      # El SHA de ABDSharedCode sale del propio checkout (el de este commit), y
      # los otros seis hay que subirlos aqui cuando se muevan. Es el mismo
      # trabajo manual que hace `siblings.json` en ABDSharedAssets.
      - name: Checkout ABDEep (SHA inmutable)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDEep
          ref: 943652c2086288452effbfc66c07586be93a98c8
          path: ABDEep

      - name: Checkout ABDMS2000 (SHA inmutable)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDMS2000
          ref: 351f98a52a50d2a884aa9570d8df84a6eb067194
          path: ABDMS2000

      # ABDNeural iba apuntando a f907d4d, que es un commit que NUNCA se
      # subio: el remoto esta 6 commits por detras. Medido en un laboratorio
      # con los cinco hermanos clonados cada uno en su SHA de la foto:
      #
      #   fatal: unable to read tree (f907d4d...)
      #
      # o sea que no es que el checkout avise: no puede ni leer el objeto.
      # Los otros cuatro SHA siguen validos. Este se repinnea al HEAD del
      # remoto, que es lo unico que el job puede clonar de verdad.
      #
      # LAS 55 HUERFANAS NO CAMBIAN por esto, y no es casualidad: el
      # trinquete se pasa en ese mismo laboratorio antes de repinnear, y
      # sigue en 0. Los 6 commits que faltan son de otra persona y estan
      # sin subir, asi que no se tocan.
      - name: Checkout ABDNeural (SHA inmutable)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDNeural
          ref: dd07f4c873f46fedf2904d31ce9271e0f1af7475
          path: ABDNeural

      - name: Checkout ABDCZ101 (SHA inmutable)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDCZ101
          ref: 70689419a1b6bfc22485336fd763fb096b81404d
          path: ABDCZ101

      - name: Checkout ABDSharedAssets (SHA inmutable)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDSharedAssets
          ref: 065ca6c6aef82e8d41cf6a94d650ab28f5c27e4c
          path: ABDSharedAssets

      # ABDBankManager entra en la foto (2026-10-06): es el consumidor del modulo
      # BankManager (el corte, en ABDBankManager/DOCS/bank-manager-module-cut.md),
      # y con el aqui el trinquete dejo de necesitar las 9 entradas _BANCO de
      # ALLOWLIST — el propio script prometia que sobrarian al entrar, y asi se
      # hizo: ver el bloque de comentario que las substituye en
      # tools/audit_unconsumed_sources.py. Las 55 huerfanas de la linea base no
      # cambian: este producto no consume ninguna (medido, no supuesto).
      - name: Checkout ABDBankManager (SHA inmutable)
        uses: actions/checkout@v7
        with:
          repository: ajabadia/ABDBankManager
          ref: a1d6daed45056013914e3a4ac479c2bd2ae01b52
          path: ABDBankManager

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # NINGUN WORKFLOW HACE SU PROPIO CHECKOUT ANTES DE LA ACCION.
      #
      # Va aqui, y no en el job `tools`, por una razon concreta: este es el unico
      # job que tiene los SEIS repos en disco. En `tools` solo esta ABDSharedCode,
      # asi que alli el guard solo podria mirar el workflow de este repo, que no
      # llama a la accion, y saldria verde sin haber mirado un hermano: el verde
      # de no haber mirado es el peor de todos porque parece un resultado.
      #
      # El aviso vive en el bloque de uso del `action.yml`, y un aviso en un YAML
      # no falla. Medido lo que pasa si se ignora: en ABDEep, el checkout previo
      # de `webui-bundle-ci.yml` deja el clon del llamante en la RAIZ del
      # workspace, junto a `pnpm-workspace.yaml` y `node_modules`, y encima la
      # accion clona otra copia en `<project>/`. Dos clones del mismo repo, y el
      # que no sabe cual es el bueno es el `pnpm`.
      #
      # El `--raiz` es el workspace, que es donde este job deja los seis
      # checkouts. El guion sale 2 si no encuentra ningun repo, para que un
      # `--raiz` mal calculado no se confunda con un todo bien.
      - name: 'Guard: ningun checkout antes de la accion'
        run: python ABDSharedCode/tools/guard_checkout_previo.py --check --raiz "$GITHUB_WORKSPACE"

      # POR QUE HAY UNA LINEA BASE, Y POR QUE ESTO ES PUERTA AUN ASI.
      #
      # El auditor mide que fuentes de este repo consume ALGUN producto de la
      # suite. Con la foto de los SHA de arriba salen 55 fuentes sin consumidor.
      # Medido, no supuesto: en el arbol de trabajo local salen 0, y la diferencia
      # son ficheros de ABDEep, ABDMS2000 y ABDNeural que consumen esas fuentes y
      # estan SIN COMMITEAR (`git status` da 50, 96 y 45 entradas
      # respectivamente). Ejemplo concreto: `DspEffects/CascadeShelfEq.h` solo lo
      # incluyen `ABDMS2000/Source/DSP/Effects/Equalizer.{h,cpp}` y
      # `DSPCoreTests_EqualizerParity.cpp`, los tres modificados o sin versionar, y
      # en ningun HEAD commiteado de ningun repo.
      #
      # La linea base convierte ese "estado de la suite" en deuda inventariada:
      # `tools/audit-baseline.json` son esas 55, con nombre. El trinquete muerde en
      # las dos direcciones, y por eso puede ser puerta sin mentir:
      #   - fuente huerfana que NO esta en la linea base  -> 1 (esto es de este repo)
      #   - entrada de la linea base que ya no hace falta -> 1 (hay que podarla)
      # Con eso, subir los SHA de arriba cuando el trabajo se commitee hace CAER el
      # numero de entradas de la linea base, y el paso de quitar las que sobren es
      # lo unico que queda por hacer. Sin la segunda regla, la linea base seria un
      # escudo permanente: a los 55 se les podrian sumar todos los que salieran.
      #
      # `--baseline` es un flag y no un defecto a proposito. En local los repos
      # hermanos tienen ese trabajo sin commitear en el disco, asi que la linea base
      # describiria una foto que aqui no es la realidad, y el script saldria en rojo
      # pidiendo podar 55 entradas que en local SI hacen falta. En local, sin el
      # flag, este script aplica el modo estricto: sale 1 ante cualquier huerfana que
      # no este en ALLOWLIST. En CI, este workflow pasa el flag y aplica el trinquete.
      # El trinquete solo puede morder si hay algo contra lo que morder. Si
      # alguien borra el fichero, o lo deja vacio, el script no dice nada raro:
      # sencillamente no tiene linea base y las 55 huerfanas conocidas aparecen
      # como hallazgos nuevos. El veredicto seria el correcto, pero el motivo del
      # rojo seria el equivocado, asi que se comprueba aqui, antes, y se dice.
      - name: La linea base esta commiteada y no esta vacia
        working-directory: ABDSharedCode
        run: |
          if [ ! -f tools/audit-baseline.json ]; then
            echo "::error::tools/audit-baseline.json no esta en el checkout. Sin ella el trinquete no tiene contra que compararse."
            exit 1
          fi
          python -c "import json,sys; d=json.load(open('tools/audit-baseline.json',encoding='utf-8')); n=len(d['fuentes']); print('entradas en la linea base:', n); sys.exit(0 if n else 1)" || {
            echo "::error::la linea base no parsea, o no tiene la clave fuentes, o esta vacia. Regenerala con --write-baseline."
            exit 1
          }

      - name: Audit de fuentes sin consumidor (trinquete)
        id: audit
        working-directory: ABDSharedCode
        run: |
          # `set +e` para que un codigo de salida 1 no corte el paso antes de
          # poder leerlo. El paso de al lado es el que decide; este solo mide y
          # anota. Asi el codigo no se pierde nunca y no hace falta un
          # continue-on-error, que es justo lo que hacia que este job fuese verde
          # sin mirar.
          set +e
          python tools/audit_unconsumed_sources.py --check --baseline tools/audit-baseline.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: El veredicto (esta puerta no se puede dejar en warning)
        working-directory: ABDSharedCode
        env:
          CODIGO: ${{ steps.audit.outputs.exit }}
        run: |
          case "$CODIGO" in
            0)
              echo "::notice::Audit en verde: ninguna fuente huerfana por encima de la linea base."
              ;;
            1)
              echo "::error::El trinquete muerde: hay una fuente sin consumidor que no esta en la linea base, o una entrada de la linea base que ya no hace falta. El informe completo va debajo."
              python tools/audit_unconsumed_sources.py --baseline tools/audit-baseline.json || true
              exit 1
              ;;
            2)
              echo "::error::El audit no se pudo ejecutar (codigo 2, error de invocacion o excepcion). No es un hallazgo: es que la comprobacion no llego a hacerse."
              exit 1
              ;;
            3)
              echo "::error::El audit no ha podido comprobar (codigo 3): no hay hermanos clonados al lado. Eso es un fallo de ESTE workflow, no un hallazgo. Suele ser un checkout que no se completo."
              exit 1
              ;;
            *)
              echo "::error::El audit devolvio un codigo inesperado: '$CODIGO'."
              exit 1
              ;;
          esac

  synthcore:
    # El primer trabajo de este repo que ejecuta C++ en vez de solo mirarlo.
    # Las TRES baterias sin JUCE y sin GUI del proyecto en un solo trabajo:
    # `ABDShared_SynthCore_Tests` (los motores de SynthCore: arpegiador,
    # secuenciador de control, LFO y envolvente analogicos, drift, la familia
    # de osciladores y el catalogo del S950), `ABDShared_DspCore_Tests` (el
    # sustrato: buffers, MIDI, determinismo de semillas y el filtro
    # resonante asertado con y sin su control de nivel) y
    # `ABDShared_DspEffects_Tests` (el catalogo de 56 efectos y el contrato de
    # politicas inyectadas). Entre los tres, mas de ocho mil comprobaciones.
    #
    # El exit code de CADA binario ES el veredicto. El paso de ejecucion no
    # filtra ni captura nada: una sola comprobacion en rojo devuelve 1 y
    # Actions corta el job, igual que cualquier fallo de compilacion de los
    # pasos de arriba. Si un binario no aparece pese a haber compilado, eso
    # tambien es un error del job y se dice con ::error::.
    #
    # Dos piernas a proposito y con `fail-fast: false`, para que las dos
    # informen aunque una se caiga: en ubuntu se compila con gcc/clang, que es
    # donde este codigo nunca se habia ejecutado (y donde salio el error de
    # std::size sin <iterator> que reventaba Arpeggiator.cpp), y en windows
    # con MSVC, que es donde se escribe. Se piden SOLO esos tres targets a
    # cmake: los demas modulos del proyecto —AutoUpdater en especial, que
    # enlaza juce_core/juce_events— no se tocan, porque sin JUCE en scope
    # construirlos aqui seria un error, no una comprobacion.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Motores (SynthCore + DspCore + DspEffects, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout ABDSharedCode
        uses: actions/checkout@v7

      - name: Configurar CMake (las tres baterias, sin JUCE)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DABDSHAREDCODE_BUILD_AUTOUPDATER=OFF

      - name: Compilar ABDShared_SynthCore_Tests, ABDShared_DspCore_Tests y ABDShared_DspEffects_Tests
        run: cmake --build build --target ABDShared_SynthCore_Tests ABDShared_DspCore_Tests ABDShared_DspEffects_Tests --config Release --parallel

      - name: Ejecutar las tres suites (el exit code es el veredicto)
        shell: bash
        run: |
          # Cada binario cae en la raiz de build/ con los generators de una
          # sola configuracion (ubuntu) y en build/Release con los de varios
          # (Visual Studio, en windows). Se busca con -quit para no tuberia,
          # se comprueba que existe y se ejecuta tal cual: sin `| tee` ni
          # capturas que pudieran devolver el codigo de salida de otro.
          # Se ejecutan LAS TRES aunque una falle, para que el log diga que
          # esta rojo ademas de que algo esta rojo; el codigo de salida del
          # job es 1 si cualquiera de las tres lo fue.
          status=0
          for target in ABDShared_SynthCore_Tests ABDShared_DspCore_Tests ABDShared_DspEffects_Tests; do
            bin=$(find build -maxdepth 2 -type f \( -name "$target" -o -name "$target.exe" \) -print -quit)
            echo "binario: ${bin:-NO ENCONTRADO}"
            if [ -z "$bin" ]; then
              echo "::error::no se encontro $target: la compilacion salio bien pero no dejo binario ejecutable"
              status=1
              continue
            fi
            "$bin" || status=1
          done
          exit $status