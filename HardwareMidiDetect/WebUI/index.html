<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detect Hardware</title>
  <style>
    :root {
      --bg: #12141c;
      --panel: #1b1f2b;
      --panel-2: #232836;
      --border: #2c3345;
      --text: #e6e9f2;
      --muted: #98a0b3;
      --accent: #4f8cff;
      --ok: #2ecc71;
      --warn: #f39c12;
      --danger: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: #fff; border: none; border-radius: 6px;
      padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    #status { margin-top: 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
    #result { margin-top: 10px; font-size: 13px; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--danger); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.on { background: var(--ok); animation: blink 1s infinite; }
    .dot.off { background: var(--muted); }
    .device-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .device-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .device-item:hover { border-color: var(--accent); background: #2a3042; }
    .device-item.selected { border-color: var(--accent); background: #1e283f; }
    .device-item input[type="radio"] { accent-color: var(--accent); }
    .device-info { flex: 1; min-width: 0; }
    .device-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .device-badge.verified { background: rgba(46, 204, 113, 0.15); border-color: var(--ok); color: var(--ok); }
    .device-badge.heuristic { background: rgba(243, 156, 18, 0.15); border-color: var(--warn); color: var(--warn); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <h2>Hardware Detection</h2>
  <div class="sub">Scans MIDI ports for known synthesizer hardware and matches against shared contracts.</div>

  <div class="panel row">
    <button id="rescan" class="ghost">Rescan Ports</button>
    <button id="detect">Detect Hardware</button>
  </div>

  <div class="panel">
    <div class="row">
      <span class="dot off" id="dot"></span>
      <span id="listenLabel" class="sub" style="margin:0">Ready</span>
    </div>
    <div id="status">Click Detect to probe connected hardware.</div>
  </div>

  <div id="devicePanel" class="panel" style="display:none">
    <h3 style="font-size:13px;margin-bottom:8px">Detected Devices</h3>
    <div id="deviceList" class="device-list"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button id="selectBtn" disabled>Select</button>
      <button id="cancelBtn" class="ghost">Cancel</button>
    </div>
  </div>

  <script>
    // --- State ---
    let detectedDevices = [];
    let selectedIndex = -1;

    // --- UI Helpers ---
    function setStatus(text, cls) {
      document.getElementById('status').className = cls || '';
      document.getElementById('status').textContent = text;
    }
    function setListening(on) {
      const dot = document.getElementById('dot');
      dot.className = 'dot ' + (on ? 'on' : 'off');
      document.getElementById('listenLabel').textContent = on ? 'Scanning ports...' : 'Ready';
    }
    function showDevicePanel(show) {
      document.getElementById('devicePanel').style.display = show ? 'block' : 'none';
    }
    function setSelectEnabled(enabled) {
      document.getElementById('selectBtn').disabled = !enabled;
    }

    // --- Called from C++ with scan results ---
    window.__setDetectedDevices = function(devices) {
      detectedDevices = devices || [];
      const list = document.getElementById('deviceList');
      list.innerHTML = '';
      selectedIndex = -1;
      setSelectEnabled(false);

      if (detectedDevices.length === 0) {
        list.innerHTML = '<div class="empty-state">No known hardware detected.\nTry connecting your synth and rescanning.</div>';
        setStatus('No matching devices found.', 'warn');
        setListening(false);
        showDevicePanel(true);
        return;
      }

      detectedDevices.forEach((d, i) => {
        const el = document.createElement('div');
        el.className = 'device-item';
        el.innerHTML = `
          <input type="radio" name="device" ${i === 0 ? 'checked' : ''}>
          <div class="device-info">
            <div class="device-name">${escapeHtml(d.displayName)}</div>
            <div class="device-meta">${escapeHtml(d.manufacturer)} &bull; ${escapeHtml(d.model)} ${d.firmwareVersion ? '&bull; FW ' + escapeHtml(d.firmwareVersion) : ''}</div>
          </div>
          <span class="device-badge ${d.isSysExVerified ? 'verified' : 'heuristic'}">
            ${d.isSysExVerified ? 'Verified' : 'Name match'}
          </span>
        `;
        el.onclick = () => selectDevice(i);
        list.appendChild(el);
      });

      // Auto-select first
      selectDevice(0);
      setStatus(`Found ${detectedDevices.length} device${detectedDevices.length > 1 ? 's' : ''}.`, 'ok');
      setListening(false);
      showDevicePanel(true);
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
    }

    function selectDevice(i) {
      selectedIndex = i;
      document.querySelectorAll('.device-item').forEach((el, idx) => {
        el.classList.toggle('selected', idx === i);
        el.querySelector('input[type="radio"]').checked = idx === i;
      });
      setSelectEnabled(true);
    }

    function emitResult(cancelled) {
      const payload = {
        action: 'hardware.result',
        cancelled: cancelled,
        hardwareId: '',
        displayName: '',
        manufacturer: '',
        model: '',
        firmwareVersion: ''
      };
      if (!cancelled && selectedIndex >= 0) {
        const d = detectedDevices[selectedIndex];
        payload.hardwareId = d.id;
        payload.displayName = d.displayName;
        payload.manufacturer = d.manufacturer;
        payload.model = d.model;
        payload.firmwareVersion = d.firmwareVersion;
      }
      if (window.__JUCE__ && window.__JUCE__.backend && window.__JUCE__.backend.emitEvent) {
        window.__JUCE__.backend.emitEvent('nativeEvent', payload);
      }
    }

    // --- Event Handlers ---
    document.getElementById('detect').onclick = () => {
      setStatus('Scanning MIDI ports...');
      setListening(true);
      showDevicePanel(false);
      if (window.__JUCE__ && window.__JUCE__.backend && window.__JUCE__.backend.emitEvent) {
        window.__JUCE__.backend.emitEvent('nativeEvent', { action: 'hardware.detect' });
      }
    };

    document.getElementById('rescan').onclick = () => {
      if (window.__JUCE__ && window.__JUCE__.backend && window.__JUCE__.backend.emitEvent) {
        window.__JUCE__.backend.emitEvent('nativeEvent', { action: 'hardware.refreshPorts' });
      }
      // Re-trigger detection after a brief moment
      setTimeout(() => document.getElementById('detect').click(), 200);
    };

    document.getElementById('selectBtn').onclick = () => emitResult(false);
    document.getElementById('cancelBtn').onclick = () => emitResult(true);

    // Initial state
    setStatus('Ready. Click Detect to probe your hardware.', '');
    setListening(false);
    showDevicePanel(false);
  </script>
</body>
</html>
