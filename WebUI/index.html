<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABDScope Studio Telemetry</title>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get("theme") || "ms2000";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="./src/scope.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--scope-bg, #06120a);
      color: var(--scope-text-main, #e8f4fc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #scope-app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="scope-app"></div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get("theme") || "ms2000";
      document.body.setAttribute("data-theme", theme);
      document.body.classList.add("theme-" + theme);
      try {
        if (window.__JUCE__ && window.__JUCE__.backend) {
          window.__JUCE__.backend.emitEvent("pageLoaded", {});
        }
      } catch (e) {}
    });
  </script>
  <script type="module">
    import { createScope } from './src/scope.js';

    const scope = createScope({
      containerId: 'scope-app',
      mountMode: 'embedded',
      title: 'ABDSCOPE - STUDIO TELEMETRY',
      maxLanes: 4,
      layout: '2',
      enabledModes: ['oscilloscope', 'spectrum', 'lissajous', 'phase', 'spectrogram'],
      defaultMode: 'oscilloscope',
      showFreeze: true,
      showSnapshot: true,
      showVuMeters: true,
      availableTaps: [
        { id: 'stimulus',    name: 'Stimulus Generator' },
        { id: 'hardware_in', name: 'Hardware In (DUT)' },
        { id: 'diag_tone',   name: 'Diagnostic 1kHz' }
      ],
      defaultTap: 'hardware_in',
      onTapChange: (tapId, laneIdx) => {
        if (window.__JUCE__?.backend?.emitEvent) {
          window.__JUCE__.backend.emitEvent('SET_ACTIVE_TAP', { tapId, laneIdx });
        }
        if (window.chrome?.webview?.postMessage) {
          window.chrome.webview.postMessage({ type: 'SET_ACTIVE_TAP', tapId, laneIdx });
        }
      }
    });

    // Handle direct JS evaluation from C++ timer pump
    window.__pushScopeFrame = function(frameJson) {
      try {
        const frameData = typeof frameJson === 'string' ? JSON.parse(frameJson) : frameJson;
        scope.pushFrame(frameData);
      } catch (err) {
        if (window.__ABDSCOPE_DEBUG__) console.error('[ABDScope IPC Error]', err);
      }
    };

    // Standard message event listener
    window.addEventListener('message', (e) => {
      if (e.data?.event === 'scopeFrame' && e.data?.payload) {
        scope.pushFrame(e.data.payload);
      }
    });
  </script>
</body>
</html>
